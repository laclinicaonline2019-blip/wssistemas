; /etc/php/8.3/fpm/conf.d/99-aivexa.ini e /etc/php/8.3/cli/conf.d/99-aivexa.ini
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
date.timezone = UTC
session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Produção: o código só muda no deploy (o script atualizar.sh recarrega o PHP-FPM).
opcache.validate_timestamps = 0
