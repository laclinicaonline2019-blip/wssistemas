# /etc/nginx/sites-available/aivexa — troque app.suaclinica.com.br pelo seu domínio.
# O certbot (passo 7 de docs/VPS.md) acrescenta o bloco HTTPS e o redirecionamento automaticamente.
server {
    listen 80;
    listen [::]:80;
    server_name app.suaclinica.com.br;

    root /var/www/aivexa/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Arquivos ocultos (.env, .git) nunca são servidos.
    location ~ /\.(?!well-known) { deny all; }
}
