; /etc/supervisor/conf.d/aivexa.conf — fila permanente (e-mails, WhatsApp, IA, PDFs, webhooks).
; Na VPS a fila roda sempre ligada, sem esperar o cron. Ajuste numprocs ao número de núcleos.
[program:aivexa-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/aivexa/current/artisan queue:work redis --sleep=2 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/aivexa/current
user=aivexa
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/aivexa/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
