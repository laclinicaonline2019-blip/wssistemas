openapi: 3.1.0
info:
  title: AivexaClínica API
  version: 1.0.0
  description: API REST multiempresa. Autorização validada no backend; 404 para recursos de outra empresa.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    BranchHeader: { name: X-Branch-Id, in: header, required: false, schema: { type: string }, description: Filial de trabalho (validada) }
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
  schemas:
    Error: { type: object, properties: { message: { type: string }, code: { type: string } } }
    Branch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        is_headquarters: { type: boolean }
        document: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        timezone: { type: string }
    BranchInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 150 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        document: { type: string, description: CNPJ }
        email: { type: string, format: email }
        phone: { type: string }
        zip_code: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, blocked, invited] }
        two_factor_enabled: { type: boolean }
        roles: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    Assignment:
      type: object
      required: [role_id]
      properties:
        role_id: { type: string }
        branch_id: { type: string, nullable: true, description: 'null = empresa toda' }
    Role:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        is_system: { type: boolean }
        is_locked: { type: boolean }
        permissions: { type: array, items: { type: string } }
paths:
  /auth/token:
    post:
      security: []
      summary: Emite token de acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string }
                password: { type: string }
                device_name: { type: string }
                code: { type: string, description: TOTP quando 2FA ativo }
                recovery_code: { type: string }
      responses:
        '201': { description: Token emitido }
        '401': { description: Credenciais inválidas / 2FA requerido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Muitas tentativas }
  /auth/me: { get: { summary: Usuário autenticado, responses: { '200': { description: OK } } } }
  /auth/logout: { post: { summary: Revoga o token atual, responses: { '200': { description: OK } } } }
  /branches:
    get:
      summary: Lista filiais acessíveis
      parameters: [{ $ref: '#/components/parameters/BranchHeader' }, { name: search, in: query, schema: { type: string } }]
      responses: { '200': { description: OK } }
    post:
      summary: Cria filial (limite do plano)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses: { '201': { description: Criada }, '403': { description: Sem permissão }, '422': { description: Validação ou limite do plano } }
  /branches/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Detalhe, responses: { '200': { description: OK }, '404': { description: Inexistente ou de outra empresa } } }
    patch:
      summary: Atualiza
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses: { '200': { description: OK } }
  /users:
    get: { summary: Lista usuários gerenciáveis, responses: { '200': { description: OK } } }
    post:
      summary: Cria usuário (troca de senha obrigatória no 1º acesso)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
                roles: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
      responses: { '201': { description: Criado }, '422': { description: Validação/limite } }
  /users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      summary: Substitui os perfis do usuário (anti-escalonamento)
      requestBody: { content: { application/json: { schema: { type: object, properties: { roles: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } } } }
      responses: { '200': { description: OK }, '403': { description: Escalonamento de privilégio ou fora do escopo } }
  /users/{id}/block: { parameters: [{ $ref: '#/components/parameters/Id' }], post: { summary: Bloqueia e encerra sessões, responses: { '200': { description: OK } } } }
  /roles:
    get: { summary: Lista perfis, responses: { '200': { description: OK } } }
    post: { summary: Cria perfil, responses: { '201': { description: Criado } } }
  /audit-logs:
    get:
      summary: Trilha de auditoria
      parameters:
        - { name: action, in: query, schema: { type: string }, description: prefixo }
        - { name: result, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: OK } }
  /platform/companies:
    get: { summary: Lista clínicas (Super Admin), responses: { '200': { description: OK } } }
    post: { summary: Provisiona clínica, responses: { '201': { description: Criada } } }
  /platform/health: { get: { summary: Saúde do sistema, responses: { '200': { description: OK }, '503': { description: Degradado } } } }
  /specialties:
    get: { summary: Lista especialidades ativas, responses: { '200': { description: OK } } }
    post: { summary: Cria especialidade, responses: { '201': { description: Criada }, '422': { description: Nome já existe } } }
  /doctors:
    get:
      summary: Lista médicos
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: specialty_id, in: query, schema: { type: string } }
        - { name: branch_id, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Cadastra médico (limite max_doctors)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, crm, crm_state]
              properties:
                name: { type: string }
                crm: { type: string }
                crm_state: { type: string, minLength: 2, maxLength: 2 }
                user_id: { type: string, nullable: true }
                specialties: { type: array, items: { type: object, properties: { id: { type: string }, rqe: { type: string } } } }
                branches: { type: array, items: { type: string } }
      responses: { '201': { description: Criado }, '422': { description: Validação/limite } }
  /patients:
    get:
      summary: Lista/busca pacientes (CPF mascarado)
      parameters: [{ name: search, in: query, schema: { type: string }, description: 'nome, CPF, telefone ou nº do prontuário' }]
      responses: { '200': { description: OK } }
    post:
      summary: Cadastra paciente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, birth_date]
              properties:
                name: { type: string }
                social_name: { type: string }
                cpf: { type: string, nullable: true }
                birth_date: { type: string, format: date }
                sex: { type: string, enum: [F, M, I] }
                whatsapp: { type: string }
                contacts: { type: array, items: { type: object, properties: { type: { type: string, enum: [guardian, emergency, other] }, name: { type: string } } } }
                insurances: { type: array, items: { type: object, properties: { insurer_name: { type: string }, card_number: { type: string } } } }
                confirm_duplicate: { type: boolean }
      responses:
        '201': { description: Criado }
        '409': { description: Possível duplicidade (reenvie com confirm_duplicate) }
        '422': { description: Validação / responsável obrigatório para menor }
  /patients/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Ficha do paciente (acesso auditado), responses: { '200': { description: OK }, '404': { description: Inexistente ou de outra empresa } } }
    patch: { summary: Atualiza cadastro, responses: { '200': { description: OK }, '422': { description: Paciente anonimizado } } }
  /patients/{id}/consents:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: Registra concessão/revogação de consentimento, responses: { '201': { description: Registrado } } }
  /patients/{id}/export:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Exporta dados do titular (LGPD), responses: { '200': { description: OK } } }
  /patients/{id}/anonymize:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: Anonimiza (irreversível), responses: { '200': { description: OK } } }
