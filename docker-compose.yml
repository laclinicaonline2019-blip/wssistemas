# Ambiente de DESENVOLVIMENTO/HOMOLOGAÇÃO local, espelhando a produção na HostGator
# (hospedagem compartilhada): MariaDB, cache/sessão/filas no banco, fila via scheduler.
# Uso: cp .env.example .env && docker compose up -d --build
#      docker compose exec app php artisan key:generate
#      docker compose exec app php artisan aivexa:install
name: aivexa

x-app: &app
  build: .
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: aivexa
    DB_USERNAME: aivexa
    DB_PASSWORD: ${DB_PASSWORD:-aivexa_dev}
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - ./:/var/www/html
  depends_on:
    db: { condition: service_healthy }

services:
  app:
    <<: *app

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  # Igual à HostGator: o scheduler (cron) processa a fila a cada minuto.
  scheduler:
    <<: *app
    command: php artisan schedule:work

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: aivexa
      MARIADB_USER: aivexa
      MARIADB_PASSWORD: ${DB_PASSWORD:-aivexa_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    # binlog ligado + usuário sem SUPER: mesmas restrições da hospedagem compartilhada
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin=mysql-bin --server-id=1
    volumes: [dbdata:/var/lib/mysql]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  dbdata:
